name: Post Deploy

on:
  push:
    branches:
      - main

jobs:
  wait-for-deployment:
    name: Wait for Render deployment
    runs-on: ubuntu-latest

    steps:
      - name: Show expected commit
        run: |
          echo "Waiting for deployment of commit:"
          echo "${{ github.sha }}"

      - name: Get latest Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          curl --fail --silent --show-error \
            --request GET \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json"