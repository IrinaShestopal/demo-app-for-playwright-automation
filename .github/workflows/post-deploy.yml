name: Post Deploy

on:
  push:
    branches:
      - main

jobs:
  wait-for-deployment:
    name: Wait for Render deployment
    runs-on: ubuntu-latest

    steps:
      - name: Show expected commit
        run: |
          echo "Waiting for deployment of commit:"
          echo "${{ github.sha }}"

      - name: Wait for Render deployment to become live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          MAX_ATTEMPTS=60
          INTERVAL=10

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            echo "Check $i/$MAX_ATTEMPTS..."

            RESPONSE=$(curl --fail --silent --show-error \
              --request GET \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json")

            DEPLOY_SHA=$(echo "$RESPONSE" | jq -r '.[0].deploy.commit.id')
            STATUS=$(echo "$RESPONSE" | jq -r '.[0].deploy.status')

            echo "Expected SHA: $EXPECTED_SHA"
            echo "Render SHA:   $DEPLOY_SHA"
            echo "Render status: $STATUS"

            if [[ "$DEPLOY_SHA" == "$EXPECTED_SHA" && "$STATUS" == "live" ]]; then
              echo "Deployment is LIVE with the expected commit."
              exit 0
            fi

            if [[ "$DEPLOY_SHA" == "$EXPECTED_SHA" && "$STATUS" =~ ^(build_failed|update_failed|canceled|deactivated)$ ]]; then
              echo "Deployment failed with status: $STATUS"
              exit 1
            fi

            sleep "$INTERVAL"
          done

          echo "Deployment did not become LIVE within 10 minutes."
          exit 1